<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#edf8fb"/><stop offset=".58" stop-color="#f7fbff"/><stop offset="1" stop-color="#fff7e7"/></linearGradient>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#20639b"/><stop offset="1" stop-color="#2a9d8f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#183b56" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1800" height="1120" fill="#f7f9fc"/>
  <text x="80" y="70" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#172b4d">SafeWords - mockups de la interfaz</text>
  <text x="82" y="112" font-family="Arial, sans-serif" font-size="21" fill="#60758a">Propuesta visual basada en el frontend implementado con Angular y Bootstrap.</text>

  <!-- Desktop community -->
  <g filter="url(#shadow)">
    <rect x="70" y="165" width="980" height="790" rx="18" fill="#fff"/>
    <rect x="70" y="165" width="980" height="80" rx="18" fill="#fff"/>
    <circle cx="125" cy="205" r="25" fill="url(#brand)"/><path d="M114 205 h22 M125 194 v22" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="165" y="215" font-family="Arial" font-size="28" font-weight="700" fill="#173f5f">SafeWords</text>
    <text x="690" y="211" font-family="Arial" font-size="17" fill="#20639b">Inicio</text><text x="770" y="211" font-family="Arial" font-size="17" fill="#526579">Comunidad</text><text x="885" y="211" font-family="Arial" font-size="17" fill="#526579">Informacion</text>
    <rect x="960" y="183" width="65" height="42" rx="12" fill="#20639b"/><text x="976" y="210" font-family="Arial" font-size="15" fill="#fff">Entrar</text>
    <rect x="70" y="245" width="980" height="205" fill="url(#hero)"/>
    <text x="115" y="310" font-family="Arial" font-size="32" font-weight="700" fill="#172b4d">Un espacio para hablar con seguridad</text>
    <text x="115" y="350" font-family="Arial" font-size="18" fill="#60758a">Comparte experiencias, encuentra informacion y participa de forma anonima.</text>
    <rect x="115" y="378" width="172" height="45" rx="12" fill="url(#brand)"/><text x="147" y="407" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Explorar foro</text>
    <rect x="305" y="378" width="155" height="45" rx="12" fill="#fff" stroke="#bad1e1"/><text x="335" y="407" font-family="Arial" font-size="16" fill="#20639b">Leer normas</text>
    <rect x="115" y="480" width="590" height="50" rx="13" fill="#fff" stroke="#d9e5f0"/><text x="140" y="511" font-family="Arial" font-size="16" fill="#99a6b5">Buscar por tema o palabra clave</text>
    <circle cx="675" cy="505" r="15" fill="none" stroke="#20639b" stroke-width="3"/><line x1="686" y1="516" x2="698" y2="528" stroke="#20639b" stroke-width="3"/>
    <text x="115" y="585" font-family="Arial" font-size="20" font-weight="700" fill="#172b4d">Conversaciones recientes</text>
    <rect x="115" y="615" width="860" height="105" rx="14" fill="#fff" stroke="#e2eaf0"/>
    <rect x="140" y="638" width="100" height="25" rx="12" fill="#e8f5f3"/><text x="157" y="656" font-family="Arial" font-size="13" fill="#238277">Bienestar</text>
    <text x="140" y="691" font-family="Arial" font-size="19" font-weight="700" fill="#243b5a">Como pedir ayuda cuando algo pasa en internet?</text>
    <text x="820" y="657" font-family="Arial" font-size="14" fill="#8190a3">Anonimo</text><text x="820" y="686" font-family="Arial" font-size="14" fill="#8190a3">12 comentarios</text>
    <rect x="115" y="745" width="860" height="105" rx="14" fill="#fff" stroke="#e2eaf0"/>
    <rect x="140" y="768" width="105" height="25" rx="12" fill="#dcebf7"/><text x="157" y="786" font-family="Arial" font-size="13" fill="#20639b">Convivencia</text>
    <text x="140" y="821" font-family="Arial" font-size="19" font-weight="700" fill="#243b5a">Mi experiencia en el colegio y lo que aprendi</text>
    <text x="820" y="786" font-family="Arial" font-size="14" fill="#8190a3">Usuario</text><text x="820" y="815" font-family="Arial" font-size="14" fill="#8190a3">8 comentarios</text>
  </g>

  <!-- Mobile login / publish -->
  <g filter="url(#shadow)">
    <rect x="1110" y="165" width="300" height="790" rx="34" fill="#172b4d"/>
    <rect x="1124" y="195" width="272" height="730" rx="21" fill="#f7f9fc"/>
    <rect x="1203" y="178" width="115" height="19" rx="10" fill="#172b4d"/>
    <circle cx="1258" cy="238" r="26" fill="url(#brand)"/><path d="M1246 238 h24 M1258 226 v24" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="1173" y="295" font-family="Arial" font-size="24" font-weight="700" fill="#173f5f">Crear publicacion</text>
    <text x="1152" y="330" font-family="Arial" font-size="14" fill="#718096">Tu voz importa. Puedes publicar anonimamente.</text>
    <text x="1152" y="380" font-family="Arial" font-size="15" font-weight="700" fill="#243b5a">Titulo</text>
    <rect x="1152" y="394" width="216" height="44" rx="10" fill="#fff" stroke="#d9e5f0"/>
    <text x="1166" y="422" font-family="Arial" font-size="14" fill="#9aa7b5">Escribe un titulo...</text>
    <text x="1152" y="474" font-family="Arial" font-size="15" font-weight="700" fill="#243b5a">Contenido</text>
    <rect x="1152" y="488" width="216" height="135" rx="10" fill="#fff" stroke="#d9e5f0"/>
    <text x="1166" y="520" font-family="Arial" font-size="14" fill="#9aa7b5">Cuenta tu experiencia</text>
    <line x1="1166" y1="550" x2="1345" y2="550" stroke="#e7edf3"/><line x1="1166" y1="575" x2="1328" y2="575" stroke="#e7edf3"/>
    <text x="1152" y="666" font-family="Arial" font-size="15" font-weight="700" fill="#243b5a">Mostrar nombre</text>
    <rect x="1152" y="682" width="42" height="24" rx="12" fill="#bad1e1"/><circle cx="1164" cy="694" r="9" fill="#fff"/>
    <text x="1208" y="700" font-family="Arial" font-size="14" fill="#526579">No, publicar anonimamente</text>
    <rect x="1152" y="750" width="216" height="48" rx="12" fill="url(#brand)"/><text x="1220" y="781" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Publicar</text>
    <text x="1187" y="850" font-family="Arial" font-size="14" fill="#718096">Volver al foro</text>
  </g>

  <!-- Admin panel -->
  <g filter="url(#shadow)">
    <rect x="1450" y="165" width="280" height="790" rx="18" fill="#fff"/>
    <rect x="1450" y="165" width="280" height="100" rx="18" fill="#173f5f"/>
    <text x="1480" y="215" font-family="Arial" font-size="23" font-weight="700" fill="#fff">Panel admin</text>
    <text x="1480" y="243" font-family="Arial" font-size="14" fill="#dcebf7">Moderacion y seguridad</text>
    <text x="1480" y="310" font-family="Arial" font-size="17" font-weight="700" fill="#243b5a">Resumen</text>
    <rect x="1480" y="330" width="100" height="78" rx="12" fill="#effaf8"/><text x="1502" y="360" font-family="Arial" font-size="25" font-weight="700" fill="#2a9d8f">24</text><text x="1495" y="388" font-family="Arial" font-size="12" fill="#526579">Publicadas</text>
    <rect x="1600" y="330" width="100" height="78" rx="12" fill="#fffaf0"/><text x="1628" y="360" font-family="Arial" font-size="25" font-weight="700" fill="#b07913">5</text><text x="1612" y="388" font-family="Arial" font-size="12" fill="#526579">Reportes</text>
    <text x="1480" y="458" font-family="Arial" font-size="17" font-weight="700" fill="#243b5a">Pendientes</text>
    <rect x="1480" y="480" width="220" height="112" rx="12" fill="#f7f9fc" stroke="#e2eaf0"/>
    <circle cx="1510" cy="512" r="13" fill="#fff0c9"/><text x="1535" y="516" font-family="Arial" font-size="13" font-weight="700" fill="#526579">Comentario reportado</text>
    <text x="1500" y="546" font-family="Arial" font-size="12" fill="#8190a3">Motivo: contenido ofensivo</text>
    <rect x="1500" y="560" width="80" height="22" rx="6" fill="#20639b"/><text x="1516" y="575" font-family="Arial" font-size="11" fill="#fff">Revisar</text>
    <rect x="1480" y="620" width="220" height="112" rx="12" fill="#f7f9fc" stroke="#e2eaf0"/>
    <circle cx="1510" cy="652" r="13" fill="#dcebf7"/><text x="1535" y="656" font-family="Arial" font-size="13" font-weight="700" fill="#526579">Nueva publicacion</text>
    <text x="1500" y="686" font-family="Arial" font-size="12" fill="#8190a3">Autor visible para el admin</text>
    <rect x="1500" y="700" width="80" height="22" rx="6" fill="#2a9d8f"/><text x="1516" y="715" font-family="Arial" font-size="11" fill="#fff">Gestionar</text>
    <text x="1480" y="798" font-family="Arial" font-size="14" fill="#20639b">Usuarios</text><text x="1480" y="835" font-family="Arial" font-size="14" fill="#20639b">Publicaciones</text><text x="1480" y="872" font-family="Arial" font-size="14" fill="#20639b">Reportes</text>
  </g>

  <text x="80" y="1050" font-family="Arial" font-size="17" fill="#64748b">El mockup muestra la propuesta visual final: comunidad publica, participacion autenticada y moderacion protegida.</text>
</svg>
